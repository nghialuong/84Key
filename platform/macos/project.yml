name: 84Key
options:
  bundleIdPrefix: com.nghialuong
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: "c++14"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_VERSION: "5.0"

packages:
  # Sparkle drives in-app auto-update: it reads the appcast feed (SUFeedURL),
  # verifies the EdDSA signature (SUPublicEDKey) of the downloaded DMG, and
  # installs it. See docs/RELEASE.md for the appcast/keys setup.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  84Key:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Input
      - path: Bridge
      - path: ../../core/engine
        name: Engine
      # Bundled dictionaries for automatic English detection (Copy Bundle Resources).
      - path: ../../core/data/english_words.dat
        buildPhase: resources
      - path: ../../core/data/viet_telex.dat
        buildPhase: resources
      # App icon + image assets. Source of truth lives in the repo (not the
      # generated .xcodeproj); compiled into Assets.car at build time.
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      # Carbon provides the Text Input Source (TIS) APIs used by the event tap
      # to honor the "turn off Vietnamese in other layouts" option. Other
      # CoreGraphics/AppKit/ApplicationServices symbols resolve via the SDK
      # umbrella through Cocoa.
      - sdk: Carbon.framework
      # ServiceManagement provides SMAppService for the run-at-login feature.
      - sdk: ServiceManagement.framework
      # Sparkle auto-updater framework (embedded into the .app bundle).
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: "84Key"
        PRODUCT_MODULE_NAME: "Key84"
        PRODUCT_BUNDLE_IDENTIFIER: com.nghialuong.key84
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/Key84-Bridging-Header.h
        MARKETING_VERSION: "0.1.6"
        CURRENT_PROJECT_VERSION: "8"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Input"
          - "$(SRCROOT)/Bridge"
          - "$(SRCROOT)/../../core/engine"
      configs:
        # Debug runs as a distinct app ("84Key (DEV)", separate bundle id) so a dev
        # build can be granted Accessibility on its own — without disturbing an
        # installed release's grant or sharing its UserDefaults. It also uses the
        # AppIcon-Dev icon set (red "DEV" badge) so the two entries are
        # unmistakable in System Settings > Accessibility. NOTE: only one
        # Vietnamese IME can run at a time; quit the release before testing Debug.
        Debug:
          PRODUCT_NAME: "84Key (DEV)"
          PRODUCT_BUNDLE_IDENTIFIER: com.nghialuong.key84.debug
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev

schemes:
  84Key:
    build:
      targets:
        84Key: all
    run:
      config: Debug
    test:
      config: Debug

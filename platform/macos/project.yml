name: 84Key
options:
  bundleIdPrefix: com.nghialuong
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: "c++14"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_VERSION: "5.0"

targets:
  84Key:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Input
      - path: Bridge
      - path: ../../core/engine
        name: Engine
    dependencies:
      # Carbon provides the Text Input Source (TIS) APIs used by the event tap
      # to honor the "turn off Vietnamese in other layouts" option. Other
      # CoreGraphics/AppKit/ApplicationServices symbols resolve via the SDK
      # umbrella through Cocoa.
      - sdk: Carbon.framework
      # ServiceManagement provides SMAppService for the run-at-login feature.
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_NAME: "84Key"
        PRODUCT_MODULE_NAME: "Key84"
        PRODUCT_BUNDLE_IDENTIFIER: com.nghialuong.key84
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/Key84-Bridging-Header.h
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Input"
          - "$(SRCROOT)/Bridge"
          - "$(SRCROOT)/../../core/engine"

schemes:
  84Key:
    build:
      targets:
        84Key: all
    run:
      config: Debug
    test:
      config: Debug

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  engine-tests:
    name: Core engine tests (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler version
        run: c++ --version
      - name: Build and run the engine + English-detection harness
        run: bash core/tests/run_tests.sh

  linux-engine:
    name: Linux IBus engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config dpkg-dev libibus-1.0-dev \
            ibus ibus-gtk3 ibus-gtk4 python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-ibus-1.0 xvfb xdotool dbus
      - name: Build
        run: |
          cmake -S platform/linux -B build/linux -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build/linux
      - name: Host tests (typing pipeline vs the macOS one, hotkey)
        run: ctest --test-dir build/linux --output-on-failure
      # Real keystrokes through Xvfb, ibus-daemon and GTK 3/4 text fields, all
      # private to the job.
      - name: End-to-end
        run: python3 platform/linux/tests/e2e.py --engine build/linux/ibus-engine-84key
      - name: Package (.deb)
        run: cd build/linux && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: ibus-84key-deb
          path: build/linux/*.deb

  macos-app:
    name: Build macOS app
    runs-on: macos-latest
    if:     github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # Build against the macOS 26 SDK (Xcode 26.x), matching the release pipeline
      # and local dev — the runner defaults to Xcode 16 / macOS 15 SDK. Keeps CI
      # building the same SDK we ship, so a green build reflects the real product.
      # Pick the newest installed 26.x so this survives image patch bumps.
      - name: Select Xcode 26 (macOS 26 SDK)
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "ERROR: no Xcode 26.x found on the runner" >&2; exit 1; }
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      # The Xcode project is generated from platform/macos/project.yml via
      # XcodeGen and committed; regenerate so the project always matches the
      # spec, then build without code signing.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: platform/macos
        run: xcodegen generate
      - name: Build app (no code signing)
        working-directory: platform/macos
        run: |
          xcodebuild \
            -project 84Key.xcodeproj \
            -scheme 84Key \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  engine-tests:
    name: Core engine tests (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler version
        run: c++ --version
      - name: Build and run the engine + English-detection harness
        run: bash core/tests/run_tests.sh

  engine-tests-windows:
    name: Core engine tests (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The engine has only ever been compiled by clang/gcc, where wchar_t is
      # 32-bit and <cwctype>/<algorithm> arrive transitively through libc++.
      # MSVC differs on both counts and decodes the suite's UTF-8 Vietnamese
      # literals by codepage unless told otherwise (core/CMakeLists.txt passes
      # /utf-8). Running the same 214-case oracle here is what makes the
      # Windows port's engine layer trustworthy rather than merely compiling.
      # KEY84_REQUIRE_MSVC makes configuration fail outright if the toolchain
      # resolved to anything but MSVC. Without it this job could go green on a
      # fallback compiler while testing nothing the Linux job does not already
      # cover — the exact failure mode the whole task exists to rule out.
      - name: Configure (MSVC, x64)
        run: cmake -S core -B build/core -A x64 -DKEY84_REQUIRE_MSVC=ON
      - name: Build
        run: cmake --build build/core --config Release
      - name: Run the engine + English-detection harness
        run: ctest --test-dir build/core -C Release --output-on-failure

  macos-app:
    name: Build macOS app
    runs-on: macos-latest
    if:     github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # Build against the macOS 26 SDK (Xcode 26.x), matching the release pipeline
      # and local dev — the runner defaults to Xcode 16 / macOS 15 SDK. Keeps CI
      # building the same SDK we ship, so a green build reflects the real product.
      # Pick the newest installed 26.x so this survives image patch bumps.
      - name: Select Xcode 26 (macOS 26 SDK)
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "ERROR: no Xcode 26.x found on the runner" >&2; exit 1; }
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      # The Xcode project is generated from platform/macos/project.yml via
      # XcodeGen and committed; regenerate so the project always matches the
      # spec, then build without code signing.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: platform/macos
        run: xcodegen generate
      - name: Build app (no code signing)
        working-directory: platform/macos
        run: |
          xcodebuild \
            -project 84Key.xcodeproj \
            -scheme 84Key \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
